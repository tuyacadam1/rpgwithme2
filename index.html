<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hero Academy RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast">Saved!</div>

  <!-- LOGIN -->
  <div id="login-screen" style="margin:auto; width:90%; max-width:380px;">
    <div class="rpg-card" style="text-align:center; padding:24px;">
      <div style="font-size:48px; margin-bottom:8px;">⚔️</div>
      <h2 style="color:var(--gold); margin-bottom:4px;">HERO ACADEMY</h2>
      <p style="font-size:12px; color:var(--muted); margin-bottom:16px;">Enter your Student ID to summon your hero</p>
      <input type="text" id="student-id-input" placeholder="Student ID (e.g., 2026001)"
        style="width:100%; padding:12px; border-radius:10px; border:1px solid #374151; background:#090d16; color:white; margin-bottom:12px; text-align:center; font-size:16px;">
      <button class="raid-btn" onclick="loginStudent()">ENTER WORLD</button>
    </div>
  </div>

  <!-- MAIN GAME HUD -->
  <div id="game-screen" class="hidden" style="display:flex; flex-direction:column; height:100dvh;">
    <header class="rpg-header">
      <div>
        <div style="font-weight:800; font-size:14px;" id="hud-name">Student Name</div>
        <div style="font-size:11px; color:#60a5fa;">ID: <span id="hud-id">---</span> • FLOOR <span id="hud-floor">1</span></div>
      </div>
      <div style="text-align:right;">
        <div class="cp-val"><span id="hud-cp">0</span> CP</div>
        <div class="pts-pill">★ <span id="hud-pts">0</span> Stat Points</div>
      </div>
    </header>

    <div class="game-body">
      <!-- LEFT / TOP: CHARACTER STAGE & DESIGN PICKER -->
      <div class="hero-stage-col">
        <div class="hero-stage">
          <div class="slot-col">
            <div class="gear-slot" id="slot-head" onclick="openArmory('head')"></div>
            <div class="gear-slot" id="slot-weapon" onclick="openArmory('weapon')"></div>
          </div>

          <div class="character-center">
            <img id="hero-sprite-display" class="sprite-img" src="" alt="Hero">
            <div class="pedestal-ring"></div>
          </div>

          <div class="slot-col">
            <div class="gear-slot" id="slot-armor" onclick="openArmory('armor')"></div>
            <div class="gear-slot" id="slot-boots" onclick="openArmory('boots')"></div>
            <div class="gear-slot" id="slot-accessory" onclick="openArmory('accessory')"></div>
          </div>
        </div>

        <!-- GENDER & TEACHER-UPLOADED CHARACTER DESIGNS -->
        <div class="rpg-card" style="margin-top:12px;" id="panel-customizer">
          <div class="card-title"><span>👤 Choose Gender & Character Design</span></div>
          <div class="gender-toggle">
            <button class="g-btn" id="btn-male" onclick="setGender('Male')">♂️ Male</button>
            <button class="g-btn" id="btn-female" onclick="setGender('Female')">♀️ Female</button>
          </div>
          <div class="char-picker-row" id="character-options"></div>
        </div>
      </div>

      <!-- RIGHT / BOTTOM: STATS & MISCRITS-STYLE TOWER ARENA -->
      <div class="control-col" style="display:flex; flex-direction:column; gap:12px;">
        <!-- MISCRITS-STYLE BATTLE ARENA -->
        <div class="miscrits-arena" id="panel-tower">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:11px; font-weight:800; color:#fbbf24;" id="tower-floor-badge">FLOOR 1</span>
            <span style="font-size:11px; color:#c084fc; font-weight:700;">Boss every 10th Floor</span>
          </div>

          <div class="arena-hud">
            <div class="hp-box">
              <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700;">
                <span id="arena-hero-name">Hero</span>
                <span style="color:var(--gold);" id="arena-hero-cp">0 CP</span>
              </div>
              <div class="hp-bar-track"><div class="hp-bar-fill" id="hero-hp-bar" style="width:100%;"></div></div>
            </div>

            <div class="hp-box">
              <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700;">
                <span id="arena-enemy-name">Tower Mob</span>
                <span style="color:#f87171;" id="arena-enemy-cp">250 CP</span>
              </div>
              <div class="hp-bar-track"><div class="hp-bar-fill" id="enemy-hp-bar" style="width:100%; background:#ef4444;"></div></div>
            </div>
          </div>

          <div class="arena-stage">
            <div class="combatant player" id="combatant-hero">
              <img id="arena-hero-img" src="" alt="Hero">
              <div class="arena-pad"></div>
            </div>
            <div class="combatant enemy" id="combatant-enemy">
              <img id="arena-enemy-img" src="" alt="Enemy">
              <div class="arena-pad"></div>
            </div>
          </div>

          <button class="raid-btn" id="attack-btn" onclick="battleTower()">⚔️ ATTACK / RAID FLOOR</button>
          <div id="raid-result" style="margin-top:8px; font-size:12px; text-align:center; font-weight:700; min-height:18px;"></div>
        </div>

        <!-- STAT ALLOCATION -->
        <div class="rpg-card" id="panel-stats">
          <div class="card-title">
            <span>📊 Stat Points</span>
            <span style="color:#60a5fa;">(+<span id="panel-pts">0</span> Available)</span>
          </div>
          <div id="stat-rows"></div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="focusSection('panel-tower', this)"><span class="nav-icon">⚔️</span>Arena</button>
      <button class="nav-item" onclick="openArmory('all')"><span class="nav-icon">🎒</span>Equip (5)</button>
      <button class="nav-item" onclick="focusSection('panel-stats', this)"><span class="nav-icon">📊</span>Stats</button>
      <button class="nav-item" onclick="focusSection('panel-customizer', this)"><span class="nav-icon">👤</span>Heroes</button>
      <button class="nav-item" style="color:#4ade80;" onclick="syncProgress()"><span class="nav-icon">☁️</span>Sync</button>
    </nav>
  </div>

  <!-- ARMORY DRAWER -->
  <div id="armory-modal" class="drawer hidden" onclick="if(event.target===this) closeArmory()">
    <div class="drawer-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="color:var(--gold);" id="armory-title">🎒 Hero Armory</h3>
        <button onclick="closeArmory()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
      </div>
      <div id="armory-items"></div>
    </div>
  </div>

  <script src="student.js"></script>
</body>
</html>
